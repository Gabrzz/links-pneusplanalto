<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0E0E0E}
  .c{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;
     background:radial-gradient(90% 70% at 50% 0%,rgba(254,221,0,.14),transparent 60%),
                linear-gradient(115deg,transparent 0 62%,rgba(254,221,0,.07) 62% 70%,transparent 70%),#0E0E0E}
  .c::before{content:"";position:absolute;inset:0;opacity:.05;
     background-image:repeating-linear-gradient(60deg,#fff 0 14px,transparent 14px 46px),repeating-linear-gradient(-60deg,#fff 0 14px,transparent 14px 46px)}
  img{width:860px;position:relative}
  .bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#FEDD00}
  p{position:relative;margin:40px 0 0;font:500 30px/1.2 Inter,sans-serif;color:#A0A0A0;letter-spacing:.02em}
  b{color:#FEDD00;font-family:"Archivo Black",sans-serif;font-weight:400}
</style></head>
<body><div class="c"><img src="../assets/logo.svg" alt=""><p><b>Uberlândia</b> · <b>Araguari</b> · <b>Uberaba</b></p><div class="bar"></div></div></body></html>
